<div class="screen active" id="screen-home">
    <div class="home-page">
      <section class="hero">
        <h2>Chào anh, hôm nay đọc gì nào?</h2>
        <p id="heroSub">Những bộ truyện vừa được cập nhật trên kệ</p>
        <div class="hero-wrap">
          <button type="button" class="hero-arrow prev" data-hero="-1" aria-label="Lùi">❮</button>
          <div class="hero-strip" id="heroStrip"></div>
          <button type="button" class="hero-arrow next" data-hero="1" aria-label="Tiến">❯</button>
        </div>
      </section>
      <section class="sec" id="secNew">
        <div class="sec-head"><h3 class="sec-title">✨ Truyện mới cập nhật</h3><button type="button" class="link-btn" onclick="goScreen('library')">Xem thư viện ❯</button></div>
        <div class="h-grid" id="homeNew"></div>
        <div class="home-pager" id="homePager"></div>
      </section>
      <section class="sec" id="secDone">
        <div class="sec-head"><h3 class="sec-title">🌸 Truyện đã hoàn thành</h3><button type="button" class="link-btn" id="seeDone">Xem tất cả ❯</button></div>
        <div class="h-grid" id="homeDone"></div>
      </section>
    </div>
  </div>

  <dialog class="kdlg" id="kdlg">
    <form method="dialog">
      <h3 id="kdlgTitle"></h3>
      <div class="kbody" id="kdlgBody"></div>
      <div class="kfoot">
        <button type="button" class="btn-submit secondary" id="kdlgNo">Huỷ</button>
        <button type="button" class="btn-submit primary" id="kdlgYes">Đồng ý</button>
      </div>
    </form>
  </dialog>

  <dialog class="kdlg pv-dlg" id="pvDlg" aria-labelledby="pvTitle">
    <div class="pv-head">
      <div class="pv-headl"><img class="pv-cover" id="pvCover" alt="" hidden><div><h3 id="pvTitle"></h3><p id="pvSub"></p></div></div>
      <button type="button" class="side-close" id="pvX" aria-label="Đóng xem trước">×</button>
    </div>
    <div class="pv-tools">
      <span class="pv-tip">👀 Xem lại thứ tự trang trước khi đăng nhé</span>
      <div class="seg" role="group" aria-label="Kiểu xem">
        <button type="button" class="seg-btn" data-pv="grid">▦ Lưới</button>
        <button type="button" class="seg-btn" data-pv="strip">▤ Đọc thử</button>
      </div>
    </div>
    <div class="pv-body" id="pvBody"></div>
    <div class="kfoot">
      <button type="button" class="btn-submit secondary" id="pvBack">↩ Sắp xếp lại</button>
      <button type="button" class="btn-submit primary" id="pvOk">🚀 Xác nhận đăng</button>
    </div>
  </dialog>

  <!-- FLOAT BUTTONS -->
