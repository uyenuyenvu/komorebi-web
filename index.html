<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập · Komorebi</title>
<script>
(function(){try{var t=localStorage.getItem('komorebi.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<meta name="theme-color" content="#6E987C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/00-base.css">
<link rel="stylesheet" href="public/css/01-filters-detail-reader.css">
<link rel="stylesheet" href="public/css/02-upload.css">
<link rel="stylesheet" href="public/css/03-layout-menu-home.css">
<link rel="stylesheet" href="public/css/04-master-dialog-settings.css">
<link rel="stylesheet" href="public/css/05-reader-user.css">
<link rel="stylesheet" href="public/css/06-icons-avatar.css">
<link rel="stylesheet" href="public/css/07-upload-progress.css">
<link rel="stylesheet" href="public/css/08-preview-roles.css">
<link rel="stylesheet" href="public/css/09-header-reader-tools.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body id="top" class="locked" data-page="login">
  <div class="gate" id="gate">
    <div class="gate-card" id="gateLoading"><p class="gate-loading">Đang mở cửa sổ… 🍃</p></div>

    <form class="gate-card" id="gateLogin" hidden>
      <div class="gate-leaf" aria-hidden="true">🍃</div>
      <h2>KOMOREBI</h2>
      <p class="gate-sub" id="g-sub">Chào cưng, đăng nhập để đọc tiếp nhé</p>
      <div class="field-group">
        <label for="g-email">Email</label>
        <input type="email" id="g-email" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label for="g-pass">Mật khẩu</label>
        <div class="pass-wrap">
          <input type="password" id="g-pass" autocomplete="current-password" required>
          <button type="button" class="pass-toggle" id="passToggle">Hiện</button>
        </div>
      </div>
      <div class="field-group" id="g-confirm-wrap" hidden>
        <label for="g-confirm">Nhập lại mật khẩu</label>
        <input type="password" id="g-confirm" autocomplete="new-password">
      </div>
      <p class="gate-err" id="g-err" role="alert"></p>
      <button class="btn-submit primary" id="g-btn" type="submit">Vào đọc truyện</button>
      <p class="gate-switch"><span id="g-switch-text">Chưa có tài khoản?</span> <button type="button" id="g-switch">Tạo tài khoản</button></p>
      <p class="gate-ok" id="g-ok" role="status"></p>
      <p class="gate-server" id="g-server"></p>
    </form>

    <div class="gate-card" id="gateConfig" hidden>
      <div class="gate-leaf" aria-hidden="true">🔌</div>
      <h2 style="font-size:1.6rem;letter-spacing:0">Chưa kết nối máy chủ</h2>
      <p class="gate-sub" style="margin-bottom:0">Đặt file <b>config.js</b> (đã điền URL và anon key của Supabase) cạnh file index.html rồi tải lại trang.</p>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script src="public/js/00-multipage.js"></script>
<script src="public/js/auth-login.js"></script>
</body>
</html>
